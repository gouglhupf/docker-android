apply plugin: 'com.android.application'

def compileSdkParts = (System.getenv("COMPILE_SDK_VERSION") ?: "35").tokenize('.')
def targetSdkParts = (System.getenv("TARGET_SDK_VERSION") ?: System.getenv("COMPILE_SDK_VERSION") ?: "35").tokenize('.')

android {
    namespace 'com.fabernovel.testapp'

    if (compileSdkParts.size() > 1) {
        compileSdk {
            version = release(compileSdkParts[0].toInteger()) {
                minorApiLevel = compileSdkParts[1].toInteger()
            }
        }
    } else {
        compileSdk compileSdkParts[0].toInteger()
    }
    buildToolsVersion System.getenv("BUILD_TOOLS_VERSION")

    defaultConfig {
        applicationId "com.fabernovel.testapp"
        minSdk System.getenv("MIN_SDK_VERSION").toInteger()
        targetSdk targetSdkParts[0].toInteger()
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
