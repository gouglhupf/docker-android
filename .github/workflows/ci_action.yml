name: Test action
on:
  push:
    branches-ignore:
      - develop
      - main
      - 'release/**'
jobs:
  build_and_test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test action
        uses: ./
        id: docker-android-action
        with:
          exec: sh action/test_action.sh
